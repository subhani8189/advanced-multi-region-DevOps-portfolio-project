apiVersion: apps/v1
kind: Deployment
metadata:
  # 1. FIXED: Changed to match Jenkins
  name: portfolio-deployment
  labels:
    app: portfolio-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: portfolio-web
  template:
    metadata:
      labels:
        app: portfolio-web
    spec:
      containers:
      # 2. FIXED: Changed to match Jenkins
      - name: portfolio-container
        # 3. FIXED: Jenkins will find this placeholder and replace it with your exact build number (like v34)
        image: subhani8189/my_portifilio-portfolio-web:__IMAGE_TAG__
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        
        # --- AUTO-HEALING: Liveness Probe ---
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          
        # --- TRAFFIC CONTROL: Readiness Probe ---
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: portfolio-web 
  ports:
    - protocol: TCP
      port: 80       
      targetPort: 80
